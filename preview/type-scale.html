<!DOCTYPE html>
<!-- @dsCard group="Type" name="Heading Scale" subtitle="H1–H4 hierarchy" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:20px 26px; font-family:var(--font-body); }
  .line { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--border-soft); }
  .line:last-child { border-bottom:0; }
  .tag { font-family:var(--font-label); font-size:10px; font-weight:600; letter-spacing:.1em; color:var(--fg3); width:64px; flex:none; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="line"><span class="tag">H1 · display</span><span class="ds-h1" style="font-size:40px">Shaping Urban Futures</span></div>
  <div class="line"><span class="tag">H2 · display</span><span class="ds-h2" style="font-size:30px">Global track record</span></div>
  <div class="line"><span class="tag">H3 · sans</span><span class="ds-h3">Featured Projects</span></div>
  <div class="line"><span class="tag">H4 · label</span><span class="ds-h4">Strategic advisory</span></div>
</body>
</html>
