<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Mark Variations" subtitle="Compass-star family — pick one" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{ margin:0; background:var(--paper); font-family:var(--font-body); color:var(--ink); padding:26px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .opt{ background:var(--white); border:1px solid var(--border-soft); border-radius:4px; padding:22px 12px 16px; display:flex; flex-direction:column; align-items:center; gap:14px; position:relative; }
  .opt.pick{ outline:2px solid var(--teal); }
  .opt svg{ width:64px; height:64px; color:var(--teal); }
  .nm{ font-family:var(--font-label); font-weight:700; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); text-align:center; }
  .badge{ position:absolute; top:8px; right:8px; white-space:nowrap; font-family:var(--font-label); font-size:7.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--copper); padding:3px 6px; }
  .cap{ font-family:var(--font-label); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--copper); margin:0 0 16px; }
</style>
</head>
<body>
  <p class="cap">Mark variations · compass-star family</p>
  <div class="grid">
    <div class="opt pick">
      <span class="badge">In use</span>
      <svg viewBox="0 0 100 100"><path fill="currentColor" d="M 50 3 L 53.83 40.76 L 69.09 30.91 L 59.24 46.17 L 97 50 L 59.24 53.83 L 69.09 69.09 L 53.83 59.24 L 50 97 L 46.17 59.24 L 30.91 69.09 L 40.76 53.83 L 3 50 L 40.76 46.17 L 30.91 30.91 L 46.17 40.76 Z"/><circle cx="50" cy="50" r="5.2" fill="currentColor"/></svg>
      <span class="nm">8-Point Compass</span>
    </div>
    <div class="opt">
      <svg viewBox="0 0 100 100"><path fill="currentColor" d="M50 3 L59.19 40.81 L97 50 L59.19 59.19 L50 97 L40.81 59.19 L3 50 L40.81 40.81 Z"/></svg>
      <span class="nm">4-Point North Star</span>
    </div>
    <div class="opt">
      <svg viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="4.4" stroke-linecap="round">
        <line x1="68" y1="50" x2="96" y2="50"/><line x1="62.73" y1="62.73" x2="82.53" y2="82.53"/>
        <line x1="50" y1="68" x2="50" y2="96"/><line x1="37.27" y1="62.73" x2="17.47" y2="82.53"/>
        <line x1="32" y1="50" x2="4" y2="50"/><line x1="37.27" y1="37.27" x2="17.47" y2="17.47"/>
        <line x1="50" y1="32" x2="50" y2="4"/><line x1="62.73" y1="37.27" x2="82.53" y2="17.47"/>
      </g><circle cx="50" cy="50" r="13" fill="currentColor"/></svg>
      <span class="nm">Radiant Sun</span>
    </div>
    <div class="opt">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="3"/><g transform="translate(50,50) scale(0.58) translate(-50,-50)"><path fill="currentColor" d="M 50 3 L 53.83 40.76 L 69.09 30.91 L 59.24 46.17 L 97 50 L 59.24 53.83 L 69.09 69.09 L 53.83 59.24 L 50 97 L 46.17 59.24 L 30.91 69.09 L 40.76 53.83 L 3 50 L 40.76 46.17 L 30.91 30.91 L 46.17 40.76 Z"/></g></svg>
      <span class="nm">Seal / Stamp</span>
    </div>
  </div>
</body>
</html>
