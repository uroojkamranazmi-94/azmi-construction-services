<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation / Shadows" subtitle="Soft cool-neutral system" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--paper); padding:30px 26px; font-family:var(--font-body); }
  .grid { display:flex; gap:26px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .box { width:96px; height:64px; background:var(--white); border-radius:var(--r-md); border:1px solid var(--border-soft); }
  .tok { font-family:var(--font-body); font-size:12px; color:var(--fg1); font-weight:500; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tok">xs</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tok">sm · card</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tok">md · hover</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tok">lg · modal</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-teal); background:var(--teal)"></div><span class="tok">teal · CTA</span></div>
  </div>
</body>
</html>
