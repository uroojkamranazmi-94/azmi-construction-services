<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Consultation form fields" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:24px 26px; font-family:var(--font-body); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 20px; }
  .field { display:flex; flex-direction:column; gap:7px; }
  .field.full { grid-column:1 / -1; }
  label { font-family:var(--font-label); font-size:10.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--fg2); }
  input, select { font-family:var(--font-body); font-size:14px; color:var(--fg1); padding:11px 13px; border:1px solid var(--silver); border-radius:var(--r-md); background:var(--white); outline:none; }
  input::placeholder { color:var(--steel); }
  .focus { border-color:var(--teal); box-shadow:0 0 0 3px var(--focus-ring); }
  .btn { grid-column:1/-1; font-family:var(--font-label); font-weight:600; font-size:13px; letter-spacing:.04em; background:var(--teal); color:#fff; border:none; border-radius:var(--r-md); padding:13px; cursor:pointer; }
</style>
</head>
<body>
  <div class="grid">
    <div class="field"><label>Name</label><input placeholder="Your full name"></div>
    <div class="field"><label>Email</label><input class="focus" placeholder="you@company.com" value="developer@"></div>
    <div class="field"><label>Company</label><input placeholder="Organization"></div>
    <div class="field"><label>Project Scope</label><select><option>Select scope</option></select></div>
    <button class="btn">Schedule a Consultation</button>
  </div>
</body>
</html>
