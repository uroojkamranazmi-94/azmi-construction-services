<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner Radii" subtitle="Sharp / chamfered — never pills" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 26px; font-family:var(--font-body); }
  .grid { display:flex; gap:22px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:80px; height:60px; background:var(--teal-50); border:1.5px solid var(--teal); }
  .tok { font-family:var(--font-body); font-size:12px; color:var(--fg1); font-weight:500; }
  .px { font-family:var(--font-body); font-size:11px; color:var(--fg3); }
  .note { font-size:11.5px; color:var(--fg3); margin:16px 0 0; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:var(--r-none)"></div><span class="tok">none</span><span class="px">0px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><span class="tok">sm</span><span class="px">2px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><span class="tok">md</span><span class="px">4px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><span class="tok">lg</span><span class="px">8px</span></div>
    <div class="item"><div class="box" style="border-radius:var(--r-pill); width:96px"></div><span class="tok">pill</span><span class="px">999px</span></div>
  </div>
  <p class="note">Rectilinear by default — buildings, not bubbles. Buttons &amp; chips use sharp chamfered (cut-corner) edges, never pills. Cards 4px, icon tiles 4px. Pill reserved for tiny status dots only.</p>
</body>
</html>
