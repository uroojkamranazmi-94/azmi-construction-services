<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Section Index Motif" subtitle="Copper index + teal hairline" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:26px; font-family:var(--font-body); display:flex; gap:40px; align-items:center; }
  .device { flex:none; }
  .ix { display:flex; align-items:baseline; gap:14px; }
  .num { font-family:var(--font-label); font-weight:700; font-size:13px; letter-spacing:.1em; color:var(--copper); }
  .eb { font-family:var(--font-label); font-weight:600; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--teal); }
  .hl { width:160px; height:1px; background:var(--silver); position:relative; margin-top:18px; }
  .hl::after { content:""; position:absolute; left:0; top:0; height:1px; width:56px; background:var(--teal); }
  .lbl { font-family:var(--font-body); font-size:11.5px; color:var(--fg3); max-width:230px; line-height:1.5; }
</style>
</head>
<body>
  <div class="device">
    <div class="ix"><span class="num">01</span><span class="eb">Global&nbsp;Expertise</span></div>
    <div class="hl"></div>
  </div>
  <p class="lbl">Recurring structural device — copper section index (01 / 02 / 03) paired with a teal eyebrow and an animated hairline rule that draws in on scroll. A blueprint/drafting cue used throughout.</p>
</body>
</html>
