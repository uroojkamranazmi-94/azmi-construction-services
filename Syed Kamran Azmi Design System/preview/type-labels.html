<!DOCTYPE html>
<!-- @dsCard group="Type" name="Labels & Eyebrows" subtitle="Montserrat structural caps" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 26px; font-family:var(--font-body); display:flex; flex-direction:column; gap:18px; }
  .eb { font-family:var(--font-label); font-weight:600; text-transform:uppercase; }
  .foot { font-family:var(--font-body); font-size:12px; color:var(--fg3); margin:0; }
  .pillars { display:flex; gap:34px; }
  .pillars span { font-family:var(--font-label); font-weight:700; letter-spacing:.22em; font-size:18px; color:var(--fg1); }
</style>
</head>
<body>
  <div>
    <span class="eb" style="font-size:12px; letter-spacing:.18em; color:var(--teal)">GLOBAL&nbsp;EXPERTISE</span>
    &nbsp;&nbsp;
    <span class="eb" style="font-size:12px; letter-spacing:.18em; color:var(--copper)">BRAND&nbsp;PILLARS</span>
    <p class="foot" style="margin-top:8px">Eyebrow / label · Montserrat 600 · 0.75rem · tracking 0.18em · uppercase</p>
  </div>
  <div>
    <div class="pillars"><span>CORE</span><span>URBAN</span><span>STRUCTURE</span></div>
    <p class="foot" style="margin-top:8px">Pillar device · Montserrat 700 · tracking 0.22em</p>
  </div>
</body>
</html>
