<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Clay — Primary" subtitle="Terracotta / clay — dominant accent" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 24px; font-family:var(--font-body); }
  .cap { font-family:var(--font-label); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 12px; }
  .row { display:flex; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--border-soft); }
  .cell { flex:1; height:88px; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }
  .name { font-family:var(--font-label); font-size:10.5px; font-weight:600; letter-spacing:.03em; }
  .hex { font-size:10.5px; opacity:.85; }
</style>
</head>
<body>
  <p class="cap" style="color:var(--teal)">Clay / Terracotta — PRIMARY · bold · CTAs, links, key UI</p>
  <div class="row">
    <div class="cell" style="background:var(--teal-50);  color:var(--teal-900)"><span class="name">50</span><span class="hex">#F8E3D6</span></div>
    <div class="cell" style="background:var(--teal-100); color:var(--teal-900)"><span class="name">100</span><span class="hex">#F0C9B0</span></div>
    <div class="cell" style="background:var(--teal-300); color:#fff"><span class="name">300</span><span class="hex">#E3A877</span></div>
    <div class="cell" style="background:var(--teal); color:#fff"><span class="name">Clay ●</span><span class="hex">#C85A17</span></div>
    <div class="cell" style="background:var(--teal-bright); color:#fff"><span class="name">Bright</span><span class="hex">#D97634</span></div>
    <div class="cell" style="background:var(--teal-700); color:#fff"><span class="name">700</span><span class="hex">#A4440F</span></div>
    <div class="cell" style="background:var(--teal-900); color:#fff"><span class="name">900</span><span class="hex">#6E2F0C</span></div>
  </div>
</body>
</html>
