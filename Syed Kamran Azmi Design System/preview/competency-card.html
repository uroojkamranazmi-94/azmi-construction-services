<!DOCTYPE html>
<!-- @dsCard group="Components" name="Competency Cards" subtitle="Icon-led expertise" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--paper); padding:24px 26px; font-family:var(--font-body); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card { background:var(--white); border:1px solid var(--border-soft); border-radius:var(--r-md); padding:20px 18px; }
  .ico { width:42px; height:42px; border-radius:var(--r-md); background:var(--teal-50); color:var(--teal); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .ttl { font-family:var(--font-body); font-weight:600; font-size:14.5px; color:var(--fg1); margin:0 0 5px; line-height:1.3; }
  .desc { font-family:var(--font-body); font-size:12.5px; line-height:1.5; color:var(--fg3); margin:0; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="ico"><i data-lucide="hard-hat" style="width:22px;height:22px"></i></div>
      <p class="ttl">Construction Management</p>
      <p class="desc">Real-estate development & delivery excellence.</p>
    </div>
    <div class="card">
      <div class="ico"><i data-lucide="trending-up" style="width:22px;height:22px"></i></div>
      <p class="ttl">P&amp;L Ownership</p>
      <p class="desc">Profit-center management & financial control.</p>
    </div>
    <div class="card">
      <div class="ico"><i data-lucide="globe" style="width:22px;height:22px"></i></div>
      <p class="ttl">International Procurement</p>
      <p class="desc">Cross-border sourcing & quality control.</p>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
