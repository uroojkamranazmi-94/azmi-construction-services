<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Cactus Green & Mustard" subtitle="Secondary pop + optional mustard + ink" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 24px; font-family:var(--font-body); }
  .cap { font-family:var(--font-label); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 12px; }
  .row { display:flex; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--border-soft); margin-bottom:14px; }
  .cell { flex:1; height:74px; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }
  .name { font-family:var(--font-label); font-size:10.5px; font-weight:600; letter-spacing:.03em; }
  .hex { font-size:10.5px; opacity:.85; }
</style>
</head>
<body>
  <p class="cap" style="color:var(--copper)">Olive / Cactus Green — SECONDARY · highlights &amp; accents</p>
  <div class="row">
    <div class="cell" style="background:var(--copper-50);  color:var(--copper-700)"><span class="name">50</span><span class="hex">#EEF1E3</span></div>
    <div class="cell" style="background:var(--copper-200); color:var(--copper-700)"><span class="name">200</span><span class="hex">#C8D2A6</span></div>
    <div class="cell" style="background:var(--copper); color:#fff"><span class="name">Green ●</span><span class="hex">#6B8E23</span></div>
    <div class="cell" style="background:var(--copper-bright); color:#fff"><span class="name">Bright</span><span class="hex">#7DA028</span></div>
    <div class="cell" style="background:var(--copper-700); color:#fff"><span class="name">700</span><span class="hex">#51691A</span></div>
  </div>
  <p class="cap" style="color:var(--mustard)">Mustard — optional accent pop</p>
  <div class="row" style="margin-bottom:0">
    <div class="cell" style="background:var(--mustard); color:#fff; flex:0 0 38%"><span class="name">Mustard ●</span><span class="hex">#D9A521</span></div>
    <div class="cell" style="background:var(--mustard-700); color:#fff; flex:0 0 38%"><span class="name">700</span><span class="hex">#B5851A</span></div>
    <div class="cell" style="background:var(--ink); color:#fff"><span class="name">Ink · text</span><span class="hex">#1A1A1A</span></div>
  </div>
</body>
</html>
