<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ink Scale" subtitle="Charcoal text tones" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 24px; font-family:var(--font-body); }
  .row { display:flex; gap:0; border-radius:var(--r-md); overflow:hidden; border:1px solid var(--border-soft); }
  .cell { flex:1; height:88px; display:flex; flex-direction:column; justify-content:flex-end; padding:10px; }
  .name { font-family:var(--font-label); font-size:11px; font-weight:600; letter-spacing:.04em; }
  .hex { font-size:11px; font-family:var(--font-body); opacity:.8; }
  .cap { font-family:var(--font-label); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--fg3); margin:0 0 12px; }
</style>
</head>
<body>
  <p class="cap">Ink — charcoal text scale</p>
  <div class="row">
    <div class="cell" style="background:var(--ink); color:#fff"><span class="name">Ink</span><span class="hex">#1A1A1A</span></div>
    <div class="cell" style="background:var(--ink-2); color:#fff"><span class="name">Ink 2</span><span class="hex">#3D4044</span></div>
    <div class="cell" style="background:var(--ink-3); color:#fff"><span class="name">Ink 3</span><span class="hex">#686D74</span></div>
  </div>
</body>
</html>
