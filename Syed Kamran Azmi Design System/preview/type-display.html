<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display Specimen" subtitle="Cormorant Garamond headline" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 26px; font-family:var(--font-body); }
  .meta { font-family:var(--font-label); font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
  .spec { font-family:var(--font-display); font-weight:400; font-style:italic; font-size:66px; line-height:0.98; letter-spacing:0; color:var(--fg1); margin:0; }
  .ital { color:var(--teal); font-style:italic; }
  .foot { font-family:var(--font-body); font-size:12px; color:var(--fg3); margin:16px 0 0; }
</style>
</head>
<body>
  <p class="meta">Display · Instrument Serif</p>
  <p class="spec">Shaping the <span class="ital">Cities</span> of Tomorrow</p>
  <p class="foot">Instrument Serif (italic) · confident, elegant at hero scale</p>
</body>
</html>
