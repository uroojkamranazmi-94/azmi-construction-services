<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base rhythm" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background:var(--white); padding:22px 26px; font-family:var(--font-body); }
  .row { display:flex; align-items:center; gap:12px; padding:4px 0; }
  .bar { height:14px; background:var(--teal-300); border-radius:1px; }
  .tok { font-family:var(--font-body); font-size:12px; color:var(--fg1); width:74px; font-weight:500; }
  .px { font-family:var(--font-body); font-size:11.5px; color:var(--fg3); width:46px; text-align:right; }
</style>
</head>
<body>
  <div class="row"><span class="tok">--sp-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">--sp-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">--sp-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tok">--sp-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">--sp-5</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">--sp-6</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">--sp-7</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">--sp-8</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tok">--sp-9</span><span class="px">96</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="tok">--sp-10</span><span class="px">128</span><div class="bar" style="width:128px"></div></div>
</body>
</html>
