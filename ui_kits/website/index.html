<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Website" name="Website — Homepage" subtitle="Blueprint hero, filterable grid of 18 projects, services + reach teasers, contact form" viewport="1280x860" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azmi Construction Services — Executive Construction Advisory</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.300.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="core.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="home2.jsx"></script>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;
  function App() {
    const [active, setActive] = useState('');

    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    // active section tracking for nav underline
    useEffect(() => {
      const ids = ['featured', 'services', 'reach', 'contact'];
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
      }, { rootMargin: '-45% 0px -50% 0px' });
      ids.forEach((id) => { const el = document.getElementById(id); if (el) io.observe(el); });
      return () => io.disconnect();
    }, []);
    useEffect(() => {
      try {
        if (sessionStorage.getItem('scrollToContact')) {
          sessionStorage.removeItem('scrollToContact');
          setTimeout(() => {
            const el = document.getElementById('contact');
            if (el) el.scrollIntoView({ behavior: 'smooth' });
          }, 200);
        }
      } catch (e) {}
    }, []);

    const navTo = (id) => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    return (
      <React.Fragment>
        <Cursor />
        <ScrollProgress />
        <Nav active={active} onNav={navTo} page="home" />
        <Hero onNav={navTo} />
        <FeaturedSlideshow />
        <ServicesTeaser />
        <ReachTeaser />
        <Contact />
        <Footer />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
